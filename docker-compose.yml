services:
    db:
        image: postgis/postgis:17-3.4
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-gohair}
            POSTGRES_USER: ${DB_USERNAME:-gohair}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - '${FORWARD_DB_PORT:-5433}:5432'
        volumes:
            - gohair-pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-gohair} -d ${DB_DATABASE:-gohair}']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - gohair-redisdata:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    gohair-pgdata:
        driver: local
    gohair-redisdata:
        driver: local
